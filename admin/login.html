<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../Css/style.css">
    <title>Connexion Admin - MINISTER'S DEKO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px;">
        <h2 style="text-align: center; margin-bottom: 8px; font-size: 1.5rem; color: #1b1b1b;">MINISTER'S DEKO</h2>
        <p style="text-align: center; color: #666; font-size: 0.9rem; margin-bottom: 25px;">Espace d'administration</p>
        
        <p id="error-msg" style="display: none; color: #e74c3c; background: #fde8e8; padding: 10px; border-radius: 6px; text-align: center; font-size: 0.85rem; margin-bottom: 15px;"></p>

        <form id="login-form">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px;">Email Admin</label>
                <input type="email" id="email" required placeholder="admin@ministerdeko.com" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 5px;">Mot de passe</label>
                <input type="password" id="password" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box;">
            </div>
            <button type="submit" id="btn-submit" style="width: 100%; padding: 12px; background: #25D366; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                Se connecter
            </button>
        </form>
    </div>

<script>
// Configurations Supabase
const SUPABASE_URL = 'https://xujwvzaucxgcponznaxa.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_pOywnX7vC3ffYbcn5gCXMg_NQMojr5J';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Redirection si déjà connecté
async function checkAuth() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
        window.location.href = 'index.html';
    }
}
checkAuth();

// Soumission du formulaire
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorMsg = document.getElementById('error-msg');
    const btn = document.getElementById('btn-submit');
    
    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion...';

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        errorMsg.textContent = 'Identifiants incorrects ou erreur de connexion.';
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
    } else {
        window.location.href = 'index.html';
    }
});
</script>
</body>
</html>
